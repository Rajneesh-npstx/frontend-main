
name: Sync Repository A to B

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push changes to Repository B
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git push https://x-access-token:${SYNC_TOKEN}@github.com/Rajneesh-npstx/frontend-main.git HEAD:main
